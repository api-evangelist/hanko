openapi: 3.2.0
info:
  title: Hanko Status API
  version: 1.2.0
  contact:
    email: developers@hanko.io
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.txt
  description: 'Operations tagged Status across 2 of this provider''s published API definitions: hanko-admin-api-openapi.yml, hanko-public-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant_id}.hanko.io/admin
  variables:
    tenant_id:
      default: ''
      description: The (UU)ID of a tenant. Replace the default value with your tenant ID.
- url: https://{tenant_id}.hanko.io
  variables:
    tenant_id:
      default: ''
      description: The (UU)ID of a tenant. Replace the default value with your tenant ID.
tags:
- name: Status
paths:
  /:
    get:
      summary: Status page
      description: Return information about the API status. Returns a 500 if there are issues with database connectivity.
      security:
      - BearerApiKeyAuth: []
      operationId: status
      tags:
      - Status
      responses:
        '200':
          description: API is running
          content:
            text/html:
              schema:
                type: string
        '500':
          description: API is not functioning properly
          content:
            text/html:
              schema:
                type: string
    servers:
    - url: https://{tenant_id}.hanko.io/admin
      variables:
        tenant_id:
          default: ''
          description: The (UU)ID of a tenant. Replace the default value with your tenant ID.
components:
  securitySchemes:
    BearerApiKeyAuth:
      description: Bearer authentication header of the form `Bearer <token>`, where `<token>` is your API key. Must only be used when using Hanko Cloud.
      type: http
      scheme: bearer
      bearerFormat: API Key
    CookieAuth:
      type: apiKey
      in: cookie
      name: hanko
    BearerTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: More about Hanko
  url: https://github.com/teamhanko/hanko
x-refined-from:
- hanko-admin-api-openapi.yml
- hanko-public-api-openapi.yml
